name: Fetch upcoming games

# Daily: new games and games whose date, time or venue changed (~35 min).
# Mondays: the detail of every game in the window is refetched (~80 min).

on:
  schedule:
    - cron: '0 5 * * *'   # every day at 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: sweep and report only, write nothing'
        type: boolean
        default: false
      full:
        description: 'Refetch the detail of every game in the window (otherwise only new/changed)'
        type: boolean
        default: false

jobs:
  upcoming:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch upcoming games and push to Supabase
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FULL" = "true" ] || [ "$(date -u +%u)" = "1" ]; then args+=(--full); fi
          echo "python fetch_upcoming.py ${args[*]}"
          python fetch_upcoming.py "${args[@]}"
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FULL: ${{ inputs.full }}
