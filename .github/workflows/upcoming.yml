name: Fetch upcoming games

on:
  schedule:
    - cron: '0 5 * * *'   # every day at 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: sweep and report only, write nothing'
        type: boolean
        default: false

jobs:
  upcoming:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch upcoming games and push to Supabase
        run: |
          if [ "$DRY_RUN" = "true" ]; then python fetch_upcoming.py --dry-run; else python fetch_upcoming.py; fi
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
