name: Fix seasons

# One-off: corrects games stored with season 2025 by the old fetch_daily.py
# (see fix_seasons.py). SQLite only — no Supabase key is passed on purpose.
# Can be deleted once it has run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: list only, write nothing'
        type: boolean
        default: true

permissions:
  contents: write

# Shared with refresh.yml and repair.yml: all three download, modify and
# re-upload the same DB, so they must never run at the same time.
concurrency:
  group: lupl-db
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Must NOT fall back to a fresh DB — a real run would upload an empty
      # DB over the real one.
      - name: Download DB from release (required)
        run: |
          gh release download update --pattern "*.db" --dir .
          test -s swiss_floorball_lupl.db
          echo "DB restored from release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Show DB state
        run: |
          ls -l swiss_floorball_lupl.db
          python -c "import sqlite3; c = sqlite3.connect('swiss_floorball_lupl.db'); print('games:', c.execute('SELECT COUNT(*) FROM games').fetchone()[0], '| latest:', c.execute('SELECT MAX(date) FROM games').fetchone()[0])"

      - name: Back up DB before fix
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: db-before-season-fix
          path: swiss_floorball_lupl.db
          retention-days: 30

      - name: Fix seasons
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python fix_seasons.py --dry-run
          else
            python fix_seasons.py
          fi
        env:
          DRY_RUN: ${{ inputs.dry_run }}

      # Same as refresh.yml / repair.yml, so the next refresh restores exactly this DB.
      - name: Upload fixed DB to release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release delete update --yes 2>/dev/null || true
          gh release create update swiss_floorball_lupl.db \
            --title "DB Cache" --notes "Auto-updated DB" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
